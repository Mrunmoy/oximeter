[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxinode-client"
version = "0.1.0"
description = "Desktop client (TUI + CLI) for the OxiNode RP2040 USB-CDC link"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OxiNode contributors" }]
keywords = ["oximeter", "max30102", "rp2040", "tui", "serial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pyserial>=3.5",
    "rich>=13.7",
    "textual>=0.50",
    "click>=8.1",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.scripts]
oxinode = "oxinode_client.__main__:cli"

[project.urls]
Homepage = "https://github.com/mrunmoy/oxinode"
Source = "https://github.com/mrunmoy/oxinode"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oxinode_client = ["py.typed"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/oxinode_client"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["serial", "serial.*", "serial.tools.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
