name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: host-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build and run host tests
        run: nix develop --command bash -lc 'CC=gcc CXX=g++ ./scripts/build.sh host-tests'

  rp2040-build:
    name: rp2040-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build RP2040 firmware
        run: nix develop --command ./scripts/build.sh rp2040

  desktop-client:
    name: desktop-client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host/desktop_client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/desktop_client/pyproject.toml

      - name: Install desktop client dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run desktop client tests
        run: python -m pytest -q

      - name: Run desktop client type checks
        run: python -m mypy --strict src/oxinode_client

      - name: Run desktop client lint
        run: python -m ruff check src tests
